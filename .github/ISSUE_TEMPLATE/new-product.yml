name: 补充产品
description: 建议收录新的浏览器环境管理产品
title: "[产品建议] "
body:
  - type: input
    id: product
    attributes:
      label: 产品名称和官网
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: 免费方案、付费价格与官方资料
      description: 请列明可保存环境数、成员、API 或同步器权限，以及官网价格或帮助页。
    validations:
      required: true
